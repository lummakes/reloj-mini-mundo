<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reloj del mundo · pixel art</title>
<meta name="description" content="Un reloj con un mini mundo dentro: la hora, la luz, el clima y el paisaje de la ciudad que elijas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e4ddcf;--bg2:#efe9dc;--rimA:#fbf5e6;--rimB:#e5dbc4;--ink:#5a432e;--glow:rgba(255,176,64,.32);--glow2:rgba(255,196,110,.18);
  --track:linear-gradient(90deg,#14183f,#e8a05a,#8fb8e0,#8fb8e0,#e8883f,#14183f);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  background:radial-gradient(120% 90% at 50% 30%,var(--bg2),var(--bg)) fixed;
  color:var(--ink);font-family:'Pixelify Sans',system-ui,sans-serif;overflow-x:hidden;
}
main{width:min(96vw,1000px);display:flex;flex-direction:column;align-items:center;gap:clamp(12px,2vw,18px);min-height:100vh;min-height:100dvh;justify-content:center;padding:0;transition:transform .45s cubic-bezier(.3,.8,.3,1)}
.col{width:min(94vw,86vh,640px);display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2vw,16px)}
/* barra de herramientas */
.tools{position:fixed;top:12px;right:12px;z-index:20;display:flex;gap:8px}
.tools button{padding:9px 13px;min-width:42px}
/* buscador */
.search{position:relative;width:100%;display:flex;gap:8px;align-items:center}
.search input{
  flex:1;min-width:0;font:600 16px 'Pixelify Sans',system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(160deg,var(--rimA),var(--rimB));border:0;border-radius:999px;padding:12px 20px;outline:none;
  box-shadow:inset 0 3px 6px rgba(90,70,40,.22),inset 0 -2px 2px rgba(255,255,255,.4),0 1px 0 rgba(255,255,255,.5);
}
.search input::placeholder{color:var(--ink);opacity:.5}
.search input:focus-visible{box-shadow:inset 0 3px 6px rgba(90,70,40,.22),0 0 0 2px #c98a3a}
#results{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:15;list-style:none;border-radius:18px;overflow:hidden;
  background:var(--rimA);box-shadow:0 18px 30px -10px rgba(40,30,10,.45)}
#results li{padding:10px 18px;cursor:pointer;font-size:15px;color:var(--ink)}
#results li small{opacity:.6;margin-left:6px}
#results li:hover{background:var(--rimB)}
#results:empty{display:none}
/* reloj */
.bezel{
  position:relative;width:100%;aspect-ratio:1;border-radius:50%;padding:0;
}
.col>.bezel{width:100%;height:auto;flex:none;min-height:0;margin:0 auto;transition:transform .45s cubic-bezier(.3,.8,.3,1)}
.bezel.ding{animation:ding 3.4s ease-out}
@keyframes ding{0%{filter:brightness(1.25) saturate(1.2)}100%{filter:none}}
#ring{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;color:var(--ink)}
.face{position:absolute;inset:11%;width:auto;height:auto;aspect-ratio:1;border-radius:50%;overflow:hidden;box-shadow:0 0 60px 12px var(--glow),0 0 170px 46px var(--glow2),0 0 0 3px color-mix(in srgb,var(--ink) 28%,transparent),0 26px 40px -16px rgba(60,45,20,.35)}
.face canvas{display:block;position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;outline:none}
.face canvas.drag{cursor:grabbing}
.face::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
  box-shadow:inset 0 14px 24px -6px rgba(20,15,5,.55),inset 0 -4px 10px rgba(255,255,255,.14),inset 0 0 0 2px rgba(0,0,0,.2)}
/* info */
#cityline{font-size:clamp(15px,2.4vw,19px);text-align:center;opacity:.85;min-height:1.4em}
#cityline b{font-weight:600}
#time{font-family:'Silkscreen',monospace;font-weight:700;font-size:clamp(34px,8vw,56px);line-height:1;letter-spacing:.04em}
#cap{position:fixed;left:50%;transform:translateX(-50%);bottom:68px;z-index:5;width:max-content;max-width:92vw;pointer-events:none;font-size:clamp(15px,2.3vw,18px);opacity:.75;min-height:1.4em;text-align:center}
/* slider 24h */
.sl{width:100%;padding:0 4px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;border-radius:99px;background:var(--track);
  box-shadow:inset 0 2px 5px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.4);outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,#fff 0,rgba(255,255,255,.55) 18%,rgba(220,200,170,.5) 46%,rgba(140,110,80,.6) 100%);
  border:2px solid rgba(255,255,255,.75);box-shadow:0 6px 10px rgba(30,20,10,.35)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,#fff 0,rgba(220,200,170,.6) 50%,rgba(140,110,80,.6) 100%);border:2px solid rgba(255,255,255,.75);box-shadow:0 6px 10px rgba(30,20,10,.35)}
input[type=range]:focus-visible{outline:2px solid #c98a3a;outline-offset:4px}
.ticks{position:relative;height:1.5em;margin-top:2px}
.ticks span{position:absolute;top:0;transform:translateX(-50%);font-family:'Silkscreen',monospace;font-size:clamp(9px,1.5vw,11px);opacity:.55;padding-top:7px}
.ticks span::before{content:"";position:absolute;left:50%;top:0;width:1px;height:5px;background:currentColor}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button,.chip{
  font:600 14px 'Pixelify Sans',system-ui,sans-serif;color:inherit;cursor:pointer;border:0;border-radius:999px;padding:9px 18px;
  background:linear-gradient(160deg,var(--rimA),var(--rimB));
  box-shadow:0 6px 12px -4px rgba(60,45,20,.35),inset 0 2px 1px rgba(255,255,255,.7),inset 0 -3px 5px rgba(120,100,60,.18);
  transition:transform .12s,box-shadow .12s;white-space:nowrap}
button:active{transform:translateY(1px)}
button[aria-pressed="true"]{box-shadow:0 1px 3px -1px rgba(60,45,20,.4),inset 0 2px 6px rgba(120,100,60,.38)}
button:focus-visible{outline:2px solid #c98a3a;outline-offset:3px}
.chip{padding:7px 13px;font-size:13px}
details{width:100%;text-align:center}
details summary{cursor:pointer;opacity:.7;font-size:15px;list-style:none;padding:6px}
details summary::-webkit-details-marker{display:none}
details .grp{margin-top:10px;display:flex;flex-direction:column;gap:10px;align-items:center}
details .lab{font-size:13px;opacity:.6}
#note{font-size:13px;opacity:.6;text-align:center;line-height:1.5;max-width:46ch}
#note a{color:inherit}
#loc{flex:none;padding:10px 14px}

.panel{width:100%;background:color-mix(in srgb,var(--rimA) 30%,transparent);border-radius:26px;padding:18px 22px;display:flex;flex-direction:column;align-items:center;gap:12px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.panel .sl{width:100%}
.h2{font-size:13px;font-weight:600;opacity:.55;text-align:center;letter-spacing:.08em;text-transform:uppercase}
details.panel{display:block;padding:12px 22px}
details[open] summary{margin-bottom:6px}
/* burbuja de cristal */
.face::before{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;z-index:2;
  box-shadow:inset 0 0 0 5px rgba(255,255,255,.34),inset 0 0 22px 8px rgba(255,255,255,.22),inset 0 -16px 26px rgba(255,226,170,.28),inset 0 12px 20px rgba(255,255,255,.18)}
.card .mb::after{content:"";position:absolute;inset:8%;border-radius:50%;pointer-events:none;background:radial-gradient(ellipse at 30% 18%,rgba(255,255,255,.55) 0,rgba(255,255,255,0) 42%)}
.card .mb{position:relative}
/* ciudades */
.minis{width:100%;margin-top:6px}
.minis h2{font-size:15px;font-weight:600;opacity:.6;text-align:center;margin-bottom:14px;letter-spacing:.04em}
#grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 8px}
.card{display:flex;flex-direction:column;align-items:center;gap:7px;background:none;box-shadow:none;padding:6px;border-radius:20px;transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.card .mb{width:100%;aspect-ratio:1;border-radius:50%;padding:8%;background:linear-gradient(160deg,var(--rimA),var(--rimB));
  box-shadow:0 14px 20px -10px rgba(60,45,20,.45),inset 0 2px 1px rgba(255,255,255,.7),inset 0 -5px 8px rgba(120,100,60,.2);transition:box-shadow .2s}
.card canvas{display:block;width:100%;height:100%;border-radius:50%;box-shadow:inset 0 4px 8px rgba(0,0,0,.4)}
.card[aria-pressed="true"] .mb{box-shadow:0 0 0 3px #d49a45,0 0 28px 6px var(--glow),inset 0 2px 1px rgba(255,255,255,.7)}
.card .nm{font-size:14px;font-weight:600;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .tm{font-family:'Silkscreen',monospace;font-size:11px;opacity:.7}
/* modo solo reloj */
.zen .hz{display:none!important}
.zen main{justify-content:center;min-height:100vh;padding:20px 0}
.zen .col{width:min(92vw,86vh)}
.zen .tools button:not(.keep){opacity:.0;pointer-events:none}
.zen .tools{opacity:.7}

/* cajón desplegable */
#bMenu{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:21;display:flex;gap:10px;align-items:center;padding:9px 18px;font-family:'Silkscreen',monospace;font-size:14px;letter-spacing:.06em}
#bMenu i{font-style:normal;transition:transform .3s;display:inline-block}
body.open #bMenu i{transform:rotate(180deg)}
#drawer{position:fixed;z-index:19;right:14px;top:64px;bottom:72px;width:min(380px,calc(100vw - 28px));overflow-y:auto;overscroll-behavior:contain;
  background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:28px;padding:10px 16px 18px;
  box-shadow:0 20px 50px -18px rgba(60,45,20,.45),inset 0 1px 0 rgba(255,255,255,.6);display:flex;flex-direction:column;gap:6px;
  opacity:0;pointer-events:none;transform:translateX(24px);transition:opacity .3s,transform .4s cubic-bezier(.3,.8,.3,1);scrollbar-width:thin}
body.open #drawer{opacity:1;pointer-events:auto;transform:none}
#drawer .panel{background:none;box-shadow:none;padding:12px 4px;border-radius:0}
#drawer .panel+.panel,#drawer details.panel+.panel{border-top:1px solid color-mix(in srgb,var(--ink) 12%,transparent)}
#drawer details.panel{padding:8px 4px}
#drawer #time{font-size:44px}
#bMenu,#cap{transition:transform .45s cubic-bezier(.3,.8,.3,1)}
@media(min-width:761px){body.open main{transform:translateX(calc(-1*min(200px,16vw)))}
  body.open #bMenu,body.open #cap{transform:translateX(calc(-50% - min(200px,16vw)))}}
@media(max-width:760px){
  #drawer{left:10px;right:10px;top:auto;bottom:70px;width:auto;height:48vh;transform:translateY(24px)}
  body.open .col>.bezel{transform:translateY(-22vh) scale(.62)}
}
.zen #bMenu,.zen #drawer{display:none!important}
</style>
</head>

<div class="tools">
  <button id="bSound" aria-pressed="false" class="keep" title="Sonido" aria-label="Sonido">🔇</button>
  <button id="bLang" title="Idioma" aria-label="Idioma">ES</button>
  <button id="bZen" class="keep" title="Solo el reloj" aria-label="Solo el reloj" aria-pressed="false">⛶</button>
</div>
<main>
  <div class="col">
    <div class="bezel" id="bezel">
      <svg id="ring" viewBox="0 0 100 100" aria-hidden="true"></svg>
      <div class="face"><canvas id="c" tabindex="0" role="slider" aria-valuemin="0" aria-valuemax="1439"></canvas></div>
    </div>
  </div>
</main>

<div id="cap" class="hz">&nbsp;</div>
<button id="bMenu" class="hz" aria-expanded="false" aria-controls="drawer"><span id="mt">--:--</span><i>▴</i></button>
<aside id="drawer" class="hz" aria-label="Opciones">
    <div class="panel hz">
      <div id="cityline">&nbsp;</div>
      <div id="time">--<i>:</i>--</div>
      <div class="sl">
        <input type="range" id="sl" min="0" max="1439" step="1" value="720">
        <div class="ticks" id="ticks"></div>
      </div>
      <div class="row">
        <button id="bNow" aria-pressed="true"></button>
        <button id="bLapse" aria-pressed="false"></button>
      </div>
    </div>

    <details class="panel hz">
      <summary id="sumExplore"></summary>
      <div class="grp">
        <div class="lab" id="labSeason"></div>
        <div class="row" id="chipSeason"></div>
        <div class="lab" id="labWx"></div>
        <div class="row" id="chipWx"></div>
      </div>
    </details>

    <div class="panel hz">
      <h2 id="hSearch" class="h2"></h2>
      <div class="search">
        <input id="q" type="search" autocomplete="off" aria-label="Buscar ciudad" spellcheck="false">
        <button id="loc" aria-label="Usar mi ubicación">◎</button>
        <ul id="results" role="listbox"></ul>
      </div>
      <p id="note"></p>
    </div>
  <section class="minis ">
    <h2 id="hCities" class="h2"></h2>
    <div id="grid"></div>
  </section>
</aside>

}

/* ═════════ bucle ═════════ */
let prev=performance.now(),acc=0,startT=prev/1000,lastWxCheck=0,lastMini=0;
function localMinNow(){
  if(Date.now()-lastOff>60000){offsetMin=tzOffsetMin(city.tz,new Date());lastOff=Date.now()}
  const tt=Date.now()/60000+offsetMin;return((tt%1440)+1440)%1440;
}
function loop(tm){
  requestAnimationFrame(loop);
  const dt=Math.min(.1,(tm-prev)/1000);prev=tm;acc+=dt;if(acc<1/24)return;const step=acc;acc=0;
  if(!city)return;
  const T=tm/1000-startT+50;
  const live=mode==='live';
  if(live)curMin=localMinNow();else if(mode==='lapse'){manualMin=(manualMin+step*30)%1440;curMin=manualMin}else curMin=manualMin;
  const hr=Math.floor(curMin/60);
  if(lastHr>=0&&hr!==lastHr&&mode!=='scrub'){pulseT=T}
  if(lastHr>=0&&hr!==lastHr&&live){bezel.classList.remove('ding');void bezel.offsetWidth;bezel.classList.add('ding');if(AU.on)bell()}
  lastHr=hr;
  if(live&&WX&&Date.now()-WX.at>15*60000&&wxStatus==='ok'){WX.at=Date.now();loadWeather()}
  renderWorld(curMin,T,live);
  lctx.putImageData(img,0,0);
  ctx.save();ctx.clearRect(0,0,CW,CW);ctx.beginPath();ctx.arc(CC,CC,RAD,0,7);ctx.clip();
  ctx.imageSmoothingEnabled=false;ctx.drawImage(lo,0,0,CW,CW);
  drawDial(curMin,T,live);drawGlass();ctx.restore();
  $('mt').textContent=fmt(curMin);
  $('time').innerHTML=fmt(curMin).slice(0,2)+'<i style="opacity:'+(live?(Math.floor(T*2)%2?1:.3):1)+'">:</i>'+fmt(curMin).slice(3);
  const cap=capFor(S.act,S.season,S.scene)+' · '+t('s_'+S.season);
  $('cap').textContent=cap;
  sl.value=Math.floor(curMin);
  cv.setAttribute('aria-valuenow',Math.floor(curMin));cv.setAttribute('aria-valuetext',fmt(curMin)+' · '+cap);
  if(T-lastWxCheck>1){lastWxCheck=T;updateInfo()}
  if(T-lastMini>1){lastMini=T;updateMinis()}
  pageTheme(T);
}

/* ═════════ inicio ═════════ */
(function init(){
  let c=null;
  try{c=JSON.parse(localStorage.getItem('reloj-city')||'null')}catch(e){}
  if(!c||!c.tz||c.lat==null){
    const tz=Intl.DateTimeFormat().resolvedOptions().timeZone;
    const l=LM.find(x=>x.tz===tz);
    if(l)c=cityBy(l.k);
    else{const f=CITIES.find(x=>x.tz===tz);c=f?Object.assign({},f):{name:(tz.split('/').pop()||'').replace(/_/g,' '),country:'',lat:47,lon:8,tz:tz||'Europe/Zurich'}}
  }
  c.scene=sceneFor(c);city=c;offsetMin=tzOffsetMin(c.tz,new Date());lastOff=Date.now();setSun();
  S.wx=PRESETS.clear.p();S.season=seasonFor();S.L=1;S.act='sleep';S.scene=c.scene;
  buildMinis();makeThumbs();applyLang();
  setCity(c);loadMiniWX();setInterval(loadMiniWX,15*60000);
  requestAnimationFrame(loop);
})();
})();
</script>
